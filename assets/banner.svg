  <text x="238" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#e9d5ff">Start production-grade projects. Keep them clean — automatically.</text>

