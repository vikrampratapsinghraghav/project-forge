<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="project-forge: the ui layer may use logic, logic may use network and data; ui importing network directly is blocked">
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="10" fill="#EEF0EE" stroke="#C9CDD1" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="136" font-size="62" font-weight="700" fill="#1C2026" letter-spacing="-1">project-forge</text>
    <text x="74" y="182" font-size="23" fill="#4A535B">Start projects the professional way.</text>
    <text x="74" y="214" font-size="23" fill="#4A535B">Keep them that way, automatically.</text>
  </g>

  <!-- the product idea: layers that only depend downward -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">
    <!-- ui -->
    <rect x="740" y="34" width="190" height="44" rx="4" fill="#FFFFFF" stroke="#1C2026" stroke-width="1.5"/>
    <text x="835" y="62" text-anchor="middle" fill="#1C2026" font-weight="600">ui</text>
    <!-- logic -->
    <rect x="740" y="124" width="190" height="44" rx="4" fill="#FFFFFF" stroke="#1C2026" stroke-width="1.5"/>
    <text x="835" y="152" text-anchor="middle" fill="#1C2026" font-weight="600">logic</text>
    <!-- network + data -->
    <rect x="740" y="214" width="190" height="44" rx="4" fill="#FFFFFF" stroke="#1C2026" stroke-width="1.5"/>
    <text x="835" y="242" text-anchor="middle" fill="#1C2026" font-weight="600">data</text>
    <rect x="968" y="214" width="170" height="44" rx="4" fill="#FFFFFF" stroke="#1C2026" stroke-width="1.5"/>
    <text x="1053" y="242" text-anchor="middle" fill="#1C2026" font-weight="600">network</text>

    <!-- allowed edges -->
    <g stroke="#5E6A71" stroke-width="1.5" fill="none">
      <path d="M835 78 V118"/>
      <path d="M829 112 l6 8 6-8"/>
      <path d="M835 168 V208"/>
      <path d="M829 202 l6 8 6-8"/>
      <path d="M930 146 H1053 V208"/>
      <path d="M1047 202 l6 8 6-8"/>
    </g>

    <!-- blocked edge: the single accent -->
    <g stroke="#C8501E" stroke-width="2" fill="none">
      <path d="M930 56 H1100 V208" stroke-dasharray="6 5"/>
    </g>
    <g transform="translate(1100 110)">
      <circle r="13" fill="#EEF0EE" stroke="#C8501E" stroke-width="2"/>
      <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#C8501E" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="1120" y="116" fill="#C8501E" font-size="15" font-weight="600">blocked</text>
  </g>
</svg>
